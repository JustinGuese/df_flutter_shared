name: df_whisper_speech
description: >-
  Speech-to-text integration for Flutter apps using the Whisper backend API
  with SSE streaming, Riverpod state management, and platform-specific audio I/O.
  Supports iOS, Android, and Web with real-time transcription and friendly error handling.
version: 0.1.0
publish_to: 'none'

repository: https://github.com/JustinGuese/df_flutter_shared
issue_tracker: https://github.com/JustinGuese/df_flutter_shared/issues

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.29.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.0.3
  dio: ^5.7.0
  record: ^6.2.0
  path_provider: ^2.1.0
  web: ^1.0.0
  # Sibling packages are git deps on this repo's `main` — the exact description
  # the apps use. A `path: ../df_x` here would reach a consuming app as a git
  # dep pinned to a commit, which pub then refuses to unify with the app's own
  # `ref: main`. tool/analyze_all.sh and CI redirect these to the checkout.
  df_ui_widgets:
    git:
      url: https://github.com/JustinGuese/df_flutter_shared.git
      path: df_ui_widgets
      ref: main

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
