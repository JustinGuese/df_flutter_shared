name: df_tour
description: Coach-mark tour harness — step model, per-step completion, safe target building, hub sheet and help button.
version: 0.1.0
publish_to: 'none'

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.29.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.0.3
  shared_preferences: ^2.3.2
  tutorial_coach_mark: ^1.3.3
  # Intra-repo dependencies by path, not git: a git dependency on this same repo
  # would resolve against published `main` instead of the checkout being built,
  # so CI could never catch a df_theme/df_ui_widgets change that breaks this
  # package. Git consumers clone the whole repo, so `../df_theme` resolves for
  # them too.
  df_theme:
    path: ../df_theme
  df_ui_widgets:
    path: ../df_ui_widgets

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
