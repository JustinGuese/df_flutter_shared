name: df_ads_revenuecat
description: RevenueCat AdMob adapter for df_ads, tracking banner and interstitial ad revenue.
version: 0.1.0
publish_to: 'none'

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.29.0'

dependencies:
  flutter:
    sdk: flutter
  # Sibling packages are git deps on this repo's `main` — the exact description
  # the apps use. A `path: ../df_x` here would reach a consuming app as a git
  # dep pinned to a commit, which pub then refuses to unify with the app's own
  # `ref: main`. tool/analyze_all.sh and CI redirect these to the checkout.
  df_ads:
    git:
      url: https://github.com/JustinGuese/df_flutter_shared.git
      path: df_ads
      ref: main
  purchases_admob_flutter: ^10.18.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
