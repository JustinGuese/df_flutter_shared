name: df_onboarding
description: Reusable onboarding flow with configurable pages and Riverpod.
version: 0.1.0
publish_to: 'none'

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.29.0'

dependencies:
  flutter:
    sdk: flutter
  # Intra-repo dependency by path, not git: a git dependency on this same repo
  # would resolve against published `main` instead of the checkout being built.
  # Git consumers clone the whole repo, so `../df_theme` resolves for them too.
  df_theme:
    path: ../df_theme
  flutter_riverpod: ^3.0.3
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
