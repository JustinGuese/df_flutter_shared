name: df_ui_widgets
description: Reusable UI widgets (chips, bullet list, loading action) with optional theme/color parameters.
version: 0.1.0
publish_to: 'none'

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.29.0'

dependencies:
  flutter:
    sdk: flutter
  # Intra-repo dependency by path, not git: a git dependency on this same repo
  # would resolve against published `main` instead of the checkout being built.
  # Git consumers clone the whole repo, so `../df_theme` resolves for them too.
  df_theme:
    path: ../df_theme

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
