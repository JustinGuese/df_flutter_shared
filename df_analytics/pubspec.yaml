name: df_analytics
description: Reusable analytics (Firebase, ATT, Meta conversion tracking, installation tracking).
version: 0.1.1
publish_to: 'none'

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.29.0'

dependencies:
  flutter:
    sdk: flutter
  # Sibling packages are git deps on this repo's `main` — the exact description
  # the apps use. See df_onboarding/pubspec.yaml for why not `path:`.
  df_analytics_core:
    git:
      url: https://github.com/JustinGuese/df_flutter_shared.git
      path: df_analytics_core
      ref: main
  firebase_analytics: ^12.0.4
  app_tracking_transparency: ^2.0.4
  facebook_app_events: ^0.24.0
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
