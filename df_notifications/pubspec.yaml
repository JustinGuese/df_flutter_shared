name: df_notifications
description: Platform-agnostic local reminder scheduling (native + web) with a soft-ask permission flow.
version: 0.1.0
publish_to: 'none'

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.29.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.1.0
  flutter_local_notifications: ^22.1.0
  timezone: ^0.11.1
  shared_preferences: ^2.2.2
  web: ^1.1.0
  # Intra-repo dependency by path, not git: a git dependency on this same repo
  # would resolve against published `main` instead of the checkout being built,
  # so CI could never catch a df_theme change that breaks this package. Git
  # consumers clone the whole repo, so `../df_theme` resolves for them too.
  df_theme:
    path: ../df_theme

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
