name: df_error_reporting_firebase
description: Firebase Crashlytics error reporting sink for DataFortress apps.
version: 0.1.0
publish_to: 'none'

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.29.0'

dependencies:
  flutter:
    sdk: flutter
  # Sibling packages are git deps on this repo's `main` — the exact description
  # the apps use. See df_onboarding/pubspec.yaml for why not `path:`.
  df_error_reporting:
    git:
      url: https://github.com/JustinGuese/df_flutter_shared.git
      path: df_error_reporting
      ref: main
  firebase_crashlytics: '>=5.0.0 <7.0.0'

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
