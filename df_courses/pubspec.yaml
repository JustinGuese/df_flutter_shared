name: df_courses
description: Multi-chapter learning courses with reading, checklist, red-flag and quiz steps.
version: 0.1.0
publish_to: 'none'

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.29.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.0.3
  flutter_markdown_plus: ^1.0.3
  shared_preferences: ^2.3.2
  # Intra-repo dependency by path, not git: a git dependency on this same repo
  # would resolve against published `main` instead of the checkout being built,
  # so CI could never catch a df_theme change that breaks this package. Git
  # consumers clone the whole repo, so `../df_theme` resolves for them too.
  df_theme:
    path: ../df_theme

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
