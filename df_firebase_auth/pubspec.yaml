name: df_firebase_auth
description: Reusable Firebase Auth with API client, login/register screens, and Riverpod providers.
version: 0.1.0
publish_to: 'none'

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.29.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.0.3
  firebase_auth: ^6.1.2
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^7.0.1
  crypto: ^3.0.5
  dio: ^5.7.0
  go_router: ^17.0.0
  url_launcher: ^6.3.1
  # Sibling packages are git deps on this repo's `main` — the exact description
  # the apps use. A `path: ../df_x` here would reach a consuming app as a git
  # dep pinned to a commit, which pub then refuses to unify with the app's own
  # `ref: main`. tool/analyze_all.sh and CI redirect these to the checkout.
  df_analytics_core:
    git:
      url: https://github.com/JustinGuese/df_flutter_shared.git
      path: df_analytics_core
      ref: main
  df_theme:
    git:
      url: https://github.com/JustinGuese/df_flutter_shared.git
      path: df_theme
      ref: main
  df_ui_widgets:
    git:
      url: https://github.com/JustinGuese/df_flutter_shared.git
      path: df_ui_widgets
      ref: main

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
