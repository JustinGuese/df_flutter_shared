name: df_ai_consent
description: Reusable AI data consent dialog and service for GDPR-compliant apps using Google Gemini.
version: 0.1.0
publish_to: 'none'

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.29.0'

dependencies:
  flutter:
    sdk: flutter
  # Sibling packages are git deps on this repo's `main` — the exact description
  # the apps use. See df_onboarding/pubspec.yaml for why not `path:`.
  df_analytics_core:
    git:
      url: https://github.com/JustinGuese/df_flutter_shared.git
      path: df_analytics_core
      ref: main
  shared_preferences: ^2.3.5
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
