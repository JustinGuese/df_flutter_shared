name: df_core_utils
description: Reusable pure-Dart utilities (date, keyword, summary parsing, animation constants). Deliberately free of platform plugins.
version: 0.1.0
publish_to: 'none'

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.29.0'

dependencies:
  flutter:
    sdk: flutter
  intl: ^0.20.2
  # Keep this list plugin-free. `downloadFile` used to live here and dragged in
  # open_filex, whose manifest injects READ_MEDIA_IMAGES/VIDEO into every
  # consuming app — that got PsychDiary rejected from Google Play under the
  # Photo and Video Permissions policy (Aug 2026). It now lives in
  # df_file_download, which apps opt into only when they really hand files to
  # the user. Most consumers want this package purely for dateOnly and friends;
  # do not make them pay Android permissions for that.

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
